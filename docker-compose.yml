version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: racademic
      POSTGRES_PASSWORD: racademic_pw
      POSTGRES_DB: racademic_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: racademic
      DB_PASSWORD: racademic_pw
      DB_NAME: racademic_db
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data: