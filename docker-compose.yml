version: '3.8'

services:
  frontend:
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./app/src:/app/src
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    build: 
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=racademic
      - DB_PASSWORD=racademic_pw
      - DB_NAME=racademic_db
      - DB_PORT=5432
    volumes:
      - ./app/backend:/app
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: racademic
      POSTGRES_PASSWORD: racademic_pw
      POSTGRES_DB: racademic_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: